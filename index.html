<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

<title>Juegos del Reporte BBVA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one-column phone app, 560px max. Home is a list of six games; each game takes the full screen and ends on a score. */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --ink:#0E2A21; --muted:#4F645B; --line:#D3DDD7;
  --brand:#0F4D3A; --on-brand:#F1F5F2; --accent:#9A6F12;
  --hero-bg:#0F4D3A; --hero-ink:#EAF3EE; --hero-soft:#B9D3C6; --hero-accent:#E3B24D;
  --good:#17703F; --good-bg:#DCF0E3; --bad:#A93226; --bad-bg:#F7DDD9;
  --c1:#17703F; --c2:#1F5AA6; --c3:#9A6F12; --c4:#7B4A9C;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1814; --surface:#11261F; --ink:#E6EFE9; --muted:#9BB2A7; --line:#22403A;
    --brand:#4FCB97; --on-brand:#06241A; --accent:#E3B24D;
    --hero-bg:#123A2E; --hero-ink:#EAF3EE; --hero-soft:#A9C7B8; --hero-accent:#E3B24D;
    --good:#5FD3A0; --good-bg:#12382A; --bad:#FF9A8B; --bad-bg:#432019;
    --c1:#5FD3A0; --c2:#7FB2F0; --c3:#E3B24D; --c4:#C79BE6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1814; --surface:#11261F; --ink:#E6EFE9; --muted:#9BB2A7; --line:#22403A;
  --brand:#4FCB97; --on-brand:#06241A; --accent:#E3B24D;
  --hero-bg:#123A2E; --hero-ink:#EAF3EE; --hero-soft:#A9C7B8; --hero-accent:#E3B24D;
  --good:#5FD3A0; --good-bg:#12382A; --bad:#FF9A8B; --bad-bg:#432019;
  --c1:#5FD3A0; --c2:#7FB2F0; --c3:#E3B24D; --c4:#C79BE6;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.5 var(--f-body);
  padding-block:12px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

.eyebrow{font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

/* Home */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:24px 20px 22px;display:flex;flex-direction:column;gap:14px;margin-top:4px}
.hero .eyebrow{color:var(--hero-soft)}
.hero h1{font:800 clamp(32px,9.5vw,46px)/1.02 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--hero-accent)}
.hero p{margin:0;color:var(--hero-soft);max-width:46ch}
.hero .facts{font:500 12px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--hero-ink)}
.list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.game{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;text-decoration:none;min-height:84px;transition:transform .12s ease,border-color .12s ease}
.game:active{transform:scale(.99)}
.game:hover{border-color:var(--ic,var(--accent))}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--ic);background:var(--bg);background:color-mix(in srgb,var(--ic) 14%,var(--surface))}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.gbody strong{font:700 17px/1.2 var(--f-display)}
.gbody span{font-size:14px;color:var(--muted);line-height:1.35}
.gbody em{font:500 12px/1.3 var(--f-mono);font-style:normal;color:var(--muted);margin-top:4px}
.chev{font-size:22px;color:var(--muted);line-height:1}
.foot{margin-top:28px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5;color:var(--muted)}
.foot p{margin:0}

/* Game screens */
.screen{display:flex;flex-direction:column;gap:16px}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.gname{font:500 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.ok{background:var(--good)}
.prog i.no{background:var(--bad)}
.prog i.now{background:var(--accent)}
.count{margin:0;font:500 13px/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer b{display:block;height:100%;width:100%;background:var(--accent)}
.qhead{display:flex;flex-direction:column;gap:8px}
.lead-q{margin:0;font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q{margin:0;font:700 23px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.q.subject{font-size:28px;line-height:1.15}

.opts{display:grid;gap:10px}
.opts.duo,.opts.quad{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 38px 12px 14px;text-align:left;font:500 16px/1.3 var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt strong{font-weight:600}
.opt small{font-size:12.5px;line-height:1.3;color:var(--muted);font-weight:400}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.is-correct{border-color:var(--good);background:var(--good-bg)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-dim{opacity:.55}
.opt[data-mark]::after{content:attr(data-mark);position:absolute;top:8px;right:12px;font-weight:800;font-size:18px;line-height:1}
.opt.is-correct::after{color:var(--good)}
.opt.is-wrong::after{color:var(--bad)}
.quad .opt{flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;min-height:104px}
.duo .opt{justify-content:center;min-height:88px;text-align:center;font:700 21px/1.1 var(--f-display)}
.duo .opt strong{font-weight:inherit}
.num .opt{font:500 22px/1.2 var(--f-mono);min-height:62px}
.num .opt strong{font-weight:inherit}

.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb strong{font:700 17px/1.2 var(--f-display)}
.fb.good strong{color:var(--good)}
.fb.bad strong{color:var(--bad)}
.fb p{margin:0;font-size:15px;line-height:1.45}
.fb .src{font:500 12px/1.4 var(--f-mono);color:var(--muted)}

.btn{display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 20px;border-radius:12px;border:0;background:var(--brand);color:var(--on-brand);font:700 16px/1 var(--f-body);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:active{transform:scale(.99)}

/* Result */
.result{align-items:stretch;text-align:left}
.big{margin:0;font:800 clamp(88px,30vw,128px)/.9 var(--f-display);letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font:500 clamp(22px,7vw,30px)/1 var(--f-mono);letter-spacing:0;color:var(--muted);margin-left:6px}
.msg{margin:0;font:600 20px/1.3 var(--f-display);text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:15px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc{position:relative;min-height:96px;padding:8px;border-radius:12px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mc span{opacity:0;font:500 13px/1.25 var(--f-body);overflow-wrap:anywhere}
.mc.term span{font:700 16px/1.15 var(--f-display)}
.mc::before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--on-brand);opacity:.55}
.mc.up,.mc.done{background:var(--surface);color:var(--ink);border-color:var(--accent)}
.mc.up span,.mc.done span{opacity:1}
.mc.up::before,.mc.done::before{display:none}
.mc.done{background:var(--good-bg);border-color:var(--good)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    best[id]=val;
    try{localStorage.setItem('bbva25',JSON.stringify(best));}catch(e){}
  }
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
let timers=[],tick=null;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function cleanup(){timers.forEach(clearTimeout);timers=[];clearInterval(tick);tick=null;}
function set(html){
  app.innerHTML=html;
  window.scrollTo(0,0);

  {id:'trivia',name:'Trivia del reporte',desc:'Diez preguntas sobre el banco y su reporte.',meta:'10 preguntas',c:'--c1',icon:IC.trivia,total:10,layout:'stack',

  {id:'verdadero-falso',name:'Verdadero o falso',desc:'Decidí en 8 segundos si la afirmación es cierta.',meta:'10 afirmaciones · 8 s cada una',c:'--c3',icon:IC.vf,total:10,layout:'duo',timer:8000,lead:'Verdadero o falso',
    build:()=>shuffle(VF).map(x=>({q:x.q,opts:[{t:'Verdadero'},{t:'Falso'}],a:x.v?0:1,why:x.why,p:x.p}))},
  {id:'grupos-de-interes',name:'Mapa de grupos de interés',desc:'Ubicá a cada grupo en la matriz de BBVA.',meta:'7 grupos',c:'--c2',icon:IC.stake,total:7,layout:'quad',qclass:'subject',lead:'¿En qué cuadrante lo ubica BBVA?',
    build:()=>shuffle(STAKE).map(x=>({q:x.q,opts:STAKE_OPTS,a:x.a,why:x.why,p:x.p}))},
  {id:'dimensiones',name:'Cuatro dimensiones',desc:'Clasificá cada dato del reporte en su dimensión.',meta:'10 datos',c:'--c4',icon:IC.dim,total:10,layout:'quad',qclass:'subject',lead:'¿A qué dimensión pertenece este dato?',
    build:()=>shuffle(DIM).slice(0,10).map(x=>({q:x.q,opts:DIM_OPTS,a:x.a,why:x.why}))},
  {id:'cifras',name:'Adiviná la cifra',desc:'Elegí el número real entre tres opciones.',meta:'8 preguntas',c:'--c3',icon:IC.num,total:8,layout:'stack num',
    build:()=>shuffle(CIFRAS).slice(0,8).map(x=>({q:x.q,opts:x.o.map(t=>({t:t})),a:x.a,why:x.why,p:x.p}))},
  {id:'memoria',name:'Memoria de conceptos',desc:'Uní cada concepto con su significado.',meta:'6 pares',c:'--c1',icon:IC.mem,kind:'memory'}

/* ---------- home ---------- */
function bestText(g){
  const v=best[g.id];
  if(v==null) return 'Sin jugar todavía';
  return g.kind==='memory'?('Mejor marca: '+v+' intentos'):('Mejor resultado: '+v+'/'+g.total);
}
function home(){
  set(
    '<section class="hero">'+
      '<p class="eyebrow">Facultad de Ciencias Económicas · UNNE</p>'+
      '<h1>Reporte Integrado <em>2025</em> en seis juegos</h1>'+
      '<p>Todas las preguntas salen del reporte de BBVA Argentina. Elegí un juego y descubrí cómo informa un banco su impacto social, ambiental y económico.</p>'+
      '<p class="facts">6 juegos · 1 a 2 minutos cada uno</p>'+
    '</section>'+
    '<ul class="list">'+GAMES.map(g=>
      '<li><a class="game" href="#'+g.id+'" style="--ic:var('+g.c+')">'+
        '<span class="ico" aria-hidden="true">'+g.icon+'</span>'+
        '<span class="gbody"><strong>'+g.name+'</strong><span>'+g.desc+'</span><em>'+g.meta+' · '+bestText(g)+'</em></span>'+
        '<span class="chev" aria-hidden="true">›</span>'+
      '</a></li>').join('')+'</ul>'+
    '<footer class="foot">'+
      '<p class="eyebrow">Aclaraciones</p>'+
      '<p>Proyecto académico sin fines de lucro del Seminario de Contabilidad Social y Ambiental, Facultad de Ciencias Económicas, Universidad Nacional del Nordeste, 2026. No es un producto de BBVA ni cuenta con su aval o participación. BBVA es una marca de su titular y se nombra solo para identificar el reporte analizado.</p>'+
      '<p>Los datos provienen de la Memoria Anual – Reporte Integrado 2025 de BBVA Argentina S.A., de acceso público, y se resumieron con fines educativos. Pueden contener errores: para cifras oficiales, consultá el reporte original.</p>'+
      '<p>Desarrollado con ayuda de Claude (Anthropic) como herramienta de apoyo. El contenido fue revisado y adaptado por los estudiantes.</p>'+
      '<p>Esta página no pide ni guarda datos personales. Tu mejor resultado queda solo en tu dispositivo. Las tipografías se cargan desde Google Fonts, de licencia abierta.</p>'+

/* ---------- quiz engine ---------- */
function bar(g){return '<div class="gbar"><a class="back" href="#">← Juegos</a><span class="gname">'+g.name+'</span></div>';}

function startQuiz(g){
  cleanup();
  const qs=g.build();
  let i=0,score=0,locked=false;
  const marks=[];

  function show(){
    const q=qs[i];
    locked=false;
    const segs=qs.map((_,k)=>'<i class="'+(k<i?marks[k]:(k===i?'now':''))+'"></i>').join('');
    set(
      '<section class="screen">'+bar(g)+
      '<div class="prog" aria-hidden="true">'+segs+'</div>'+
      '<p class="count">Pregunta '+(i+1)+' de '+qs.length+' · '+score+' '+(score===1?'acierto':'aciertos')+'</p>'+
      (g.timer?'<div class="timer" aria-hidden="true"><b id="tb"></b></div>':'')+
      '<div class="qhead">'+(g.lead?'<p class="lead-q">'+g.lead+'</p>':'')+'<h2 class="q '+(g.qclass||'')+'">'+q.q+'</h2></div>'+
      '<div class="opts '+g.layout+'" id="opts">'+q.opts.map((o,k)=>
        '<button class="opt" type="button" data-k="'+k+'">'+
          (o.c?'<span class="dot" style="background:var('+o.c+')"></span>':'')+
          '<span class="ot"><strong>'+o.t+'</strong>'+(o.sub?'<small>'+o.sub+'</small>':'')+'</span>'+
        '</button>').join('')+'</div>'+
      '<div class="fb" id="fb" hidden aria-live="polite"></div>'+
      '<button class="btn" id="next" type="button" hidden>'+(i===qs.length-1?'Ver resultado':'Siguiente')+'</button>'+
      '</section>'
    );
    $('#opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)answer(+b.dataset.k);});
    $('#next').addEventListener('click',()=>{i++;if(i<qs.length)show();else finish();});
    if(g.timer)runTimer();
  }

  function runTimer(){
    const el=$('#tb');
    const t0=performance.now();
    tick=setInterval(()=>{
      const r=Math.max(0,1-(performance.now()-t0)/g.timer);
      el.style.width=(r*100)+'%';
      if(r<=0){clearInterval(tick);tick=null;answer(-1);}
    },100);
  }

  function answer(k){
    if(locked)return;
    locked=true;
    clearInterval(tick);tick=null;
    const q=qs[i];
    const ok=k===q.a;
    if(ok)score++;
    marks[i]=ok?'ok':'no';
    document.querySelectorAll('.opt').forEach((b,idx)=>{
      b.disabled=true;
      if(idx===q.a){b.classList.add('is-correct');b.dataset.mark='✓';}
      else if(idx===k){b.classList.add('is-wrong');b.dataset.mark='✗';}
      else b.classList.add('is-dim');
    });
    const fb=$('#fb');
    fb.className='fb '+(ok?'good':'bad');
    fb.innerHTML='<strong>'+(k<0?'Se acabó el tiempo':(ok?'Correcto':'Incorrecto'))+'</strong><p>'+q.why+'</p>'+(q.p?'<p class="src">'+q.p+'</p>':'');
    fb.hidden=false;
    $('#next').hidden=false;
    fb.scrollIntoView({block:'nearest'});
  }

  function finish(){
    const total=qs.length;
    saveBest(g.id,score);
    const r=score/total;
    const msg=r>=0.9?'Excelente. Conocés el reporte al detalle.':(r>=0.6?'Muy bien. Ya casi lo dominás.':'Buen comienzo. Jugá de nuevo para mejorar.');
    set(
      '<section class="screen result">'+bar(g)+
      '<p class="eyebrow">Tu resultado</p>'+
      '<p class="big">'+score+'<small>/'+total+'</small></p>'+
      '<p class="msg">'+msg+'</p>'+
      '<div class="prog" aria-hidden="true">'+marks.map(m=>'<i class="'+m+'"></i>').join('')+'</div>'+
      '<p class="sub">Mejor resultado: '+best[g.id]+'/'+total+'</p>'+
      '<div class="actions"><button class="btn" id="again" type="button">Jugar de nuevo</button><a class="btn ghost" href="#">Elegir otro juego</a></div>'+
      '</section>'
    );
    $('#again').addEventListener('click',()=>startQuiz(g));
  }

  show();
}

/* ---------- memory ---------- */
function startMemory(g){
  cleanup();
  const cards=shuffle(PAIRS.flatMap((p,i)=>[{pair:i,t:p[0],kind:'term',st:'down'},{pair:i,t:p[1],kind:'def',st:'down'}]));
  let up=[],moves=0,matched=0,lock=false;

  set(
    '<section class="screen">'+bar(g)+
    '<h2 class="q">Uní cada concepto con su significado</h2>'+
    '<p class="count" id="mcount"></p>'+
    '<div class="mem" id="mem">'+cards.map((c,k)=>'<button class="mc '+c.kind+'" type="button" data-k="'+k+'"><span>'+c.t+'</span></button>').join('')+'</div>'+
    '</section>'
  );
  const btns=[...document.querySelectorAll('.mc')];
  function paint(){
    btns.forEach((b,k)=>{
      const c=cards[k];
      b.classList.toggle('up',c.st==='up');
      b.classList.toggle('done',c.st==='done');
      b.setAttribute('aria-label',c.st==='down'?'Carta boca abajo':c.t);
    });
    $('#mcount').textContent='Intentos: '+moves+' · Pares: '+matched+' de '+PAIRS.length;
  }
  paint();

  $('#mem').addEventListener('click',e=>{
    const b=e.target.closest('.mc');
    if(!b||lock)return;
    const c=cards[+b.dataset.k];
    if(c.st!=='down')return;
    c.st='up';up.push(c);
    if(up.length===2){
      moves++;
      const x=up[0],y=up[1];
      if(x.pair===y.pair){
        x.st='done';y.st='done';matched++;up=[];
        if(matched===PAIRS.length)later(win,800);
      }else{
        lock=true;
        later(()=>{x.st='down';y.st='down';up=[];lock=false;paint();},900);
      }
    }
    paint();
  });

  function win(){
    saveBest(g.id,moves,true);
    const msg=moves<=8?'Excelente memoria.':(moves<=12?'Muy bien. Probá hacerlo con menos intentos.':'Buen trabajo. Jugá de nuevo para bajar los intentos.');
    set(
      '<section class="screen result">'+bar(g)+
      '<p class="eyebrow">Tu resultado</p>'+
      '<p class="big">'+moves+'<small>intentos</small></p>'+
      '<p class="msg">'+msg+'</p>'+
      '<p class="sub">Mejor marca: '+best[g.id]+' intentos. Lo mínimo posible es 6.</p>'+
      '<div class="actions"><button class="btn" id="again" type="button">Jugar de nuevo</button><a class="btn ghost" href="#">Elegir otro juego</a></div>'+
      '</section>'
    );
    $('#again').addEventListener('click',()=>startMemory(g));
  }
}

/* ---------- router ---------- */
function route(){
  cleanup();
  const id=location.hash.slice(1);
  const g=GAMES.find(x=>x.id===id);
  if(!g)return home();
  if(g.kind==='memory')startMemory(g);else startQuiz(g);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
